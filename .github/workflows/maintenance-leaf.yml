name: Maintenance Leaf Updates

on:
  workflow_dispatch:
    inputs:
      leaf:
        description: Leaf to update, or all eligible leaves
        required: true
        default: all
        type: choice
        options:
          - all
          - codex
          - orca
          - zeroclaw
  schedule:
    - cron: "17 */4 * * *"
    - cron: "23 20 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leaf: codex
            policy: tools-fast
          - leaf: orca
            policy: tools-fast
          - leaf: zeroclaw
            policy: tools
    concurrency:
      group: maintenance-leaf-${{ matrix.leaf }}
      cancel-in-progress: false
    env:
      REQUESTED_LEAF: ${{ github.event.inputs.leaf || 'all' }}
      HOSTS: homePC linglong
      CHINA_SUBSTITUTERS: >-
        https://mirrors.ustc.edu.cn/nix-channels/store
        https://anyrun.cachix.org
        https://hyprland.cachix.org
      DECLARED_EXTRA_SUBSTITUTERS: >-
        https://anyrun.cachix.org
        https://hyprland.cachix.org
      CHINA_EXTRA_TRUSTED_PUBLIC_KEYS: >-
        anyrun.cachix.org-1:pqBobmOjI7nKlsUMV25u9QHa9btJK65/C8vnO3p346s=
        hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      NIXPKGS_ALLOW_UNFREE: "1"
      GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}

    steps:
      - name: Plan leaf run
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          run_leaf=true
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_LEAF" != "all" && "$REQUESTED_LEAF" != "${{ matrix.leaf }}" ]]; then
              run_leaf=false
            fi
          else
            case "${{ github.event.schedule }}" in
              "17 */4 * * *")
                case "${{ matrix.leaf }}" in
                  codex|orca)
                    ;;
                  *)
                    run_leaf=false
                    ;;
                esac
                ;;
              "23 20 * * *")
                [[ "${{ matrix.leaf }}" == "zeroclaw" ]] || run_leaf=false
                ;;
              *)
                echo "Unknown maintenance schedule: ${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
          fi

          echo "run=${run_leaf}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.plan.outputs.run == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      - uses: cachix/install-nix-action@v31
        if: steps.plan.outputs.run == 'true'

      - name: Configure git
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update leaf
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          bash scripts/maint/update-leaf.sh "${{ matrix.leaf }}"

      - name: Check for changes
        if: steps.plan.outputs.run == 'true'
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check maintenance-sensitive changes
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        id: sensitive
        shell: bash
        run: |
          set -euo pipefail

          : > "$RUNNER_TEMP/maintenance-sensitive.files"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/changed.files"
          grep -E '^(\.github/workflows/maintenance-.*\.yml|scripts/maint/(policy\.json|.*\.sh)|renovate\.json)$' \
            "$RUNNER_TEMP/changed.files" \
            > "$RUNNER_TEMP/maintenance-sensitive.files" || true

          manual_review=false
          if [[ -s "$RUNNER_TEMP/maintenance-sensitive.files" ]]; then
            manual_review=true
          fi

          echo "manual_review=${manual_review}" >> "$GITHUB_OUTPUT"

      - name: Base China gate
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          base_worktree="$RUNNER_TEMP/base"
          git worktree add --detach "$base_worktree" HEAD

          read -r -a hosts <<< "$HOSTS"
          bash "$base_worktree/scripts/maint/china-gate.sh" \
            --report-only \
            --output "$RUNNER_TEMP/china-base.blocked" \
            --direct-output "$RUNNER_TEMP/china-base.direct" \
            "${hosts[@]}"

      - name: Global dry-run
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        id: global_gate
        shell: bash
        run: |
          set -euo pipefail

          status=pass
          read -r -a hosts <<< "$HOSTS"
          for host in "${hosts[@]}"; do
            if ! nix build \
              --dry-run \
              -L \
              --option extra-substituters "$DECLARED_EXTRA_SUBSTITUTERS" \
              --option extra-trusted-public-keys "$CHINA_EXTRA_TRUSTED_PUBLIC_KEYS" \
              ".#nixosConfigurations.${host}.config.system.build.toplevel"; then
              status=fail
            fi
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: China gate
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        id: china_gate
        shell: bash
        run: |
          set -euo pipefail

          read -r -a hosts <<< "$HOSTS"
          : > "$RUNNER_TEMP/china-head.blocked"
          : > "$RUNNER_TEMP/china-head.direct"
          : > "$RUNNER_TEMP/china-gate.failure.log"
          china_gate_log="$RUNNER_TEMP/china-gate.log"
          if ! bash scripts/maint/china-gate.sh \
            --report-only \
            --output "$RUNNER_TEMP/china-head.blocked" \
            --direct-output "$RUNNER_TEMP/china-head.direct" \
            "${hosts[@]}" \
            2>&1 | tee "$china_gate_log"; then
            cp "$china_gate_log" "$RUNNER_TEMP/china-gate.failure.log"
            : > "$RUNNER_TEMP/china-new.blocked"
            : > "$RUNNER_TEMP/china-new.direct"
            : > "$RUNNER_TEMP/china-direct.allowed"
            : > "$RUNNER_TEMP/china-unapproved.blocked"
            : > "$RUNNER_TEMP/china-new-unapproved.blocked"
            {
              echo "status=miss"
              echo "hard_failure=true"
              echo "direct_fetch=false"
              echo "head_blocked_count=0"
              echo "new_blocked_count=0"
              echo "direct_fetch_count=0"
              echo "head_unapproved_count=0"
              echo "new_unapproved_count=0"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "hard_failure=false" >> "$GITHUB_OUTPUT"
          bash scripts/maint/evaluate-china-gate.sh \
            --base-blocked "$RUNNER_TEMP/china-base.blocked" \
            --base-direct "$RUNNER_TEMP/china-base.direct" \
            --head-blocked "$RUNNER_TEMP/china-head.blocked" \
            --head-direct "$RUNNER_TEMP/china-head.direct" \
            --output-dir "$RUNNER_TEMP" \
            --leaf "${{ matrix.leaf }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Close unchanged leaf PR
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail

          branch="maint/${{ matrix.leaf }}"
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then
            gh pr close "$pr" \
              --comment "No changes remain for this fixed leaf; closing the stale maintenance PR."
            git push origin --delete "$branch" || true
          fi

      - name: Publish leaf PR
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GLOBAL_STATUS: ${{ steps.global_gate.outputs.status }}
          CHINA_STATUS: ${{ steps.china_gate.outputs.status }}
          CHINA_HARD_FAILURE: ${{ steps.china_gate.outputs.hard_failure }}
          CHINA_DIRECT_FETCH: ${{ steps.china_gate.outputs.direct_fetch }}
          CHINA_HEAD_BLOCKED_COUNT: ${{ steps.china_gate.outputs.head_blocked_count }}
          CHINA_NEW_BLOCKED_COUNT: ${{ steps.china_gate.outputs.new_blocked_count }}
          CHINA_DIRECT_FETCH_COUNT: ${{ steps.china_gate.outputs.direct_fetch_count }}
          CHINA_HEAD_UNAPPROVED_COUNT: ${{ steps.china_gate.outputs.head_unapproved_count }}
          CHINA_NEW_UNAPPROVED_COUNT: ${{ steps.china_gate.outputs.new_unapproved_count }}
          MANUAL_REVIEW: ${{ steps.sensitive.outputs.manual_review }}
        shell: bash
        run: |
          set -euo pipefail

          leaf="${{ matrix.leaf }}"
          policy="${{ matrix.policy }}"
          branch="maint/${leaf}"
          title="chore(maint): update ${leaf}"
          body="$(mktemp)"

          eligible=false
          if [[ "$MANUAL_REVIEW" != "true" && "$GLOBAL_STATUS" == "pass" && "$CHINA_STATUS" == "pass" && "$CHINA_NEW_UNAPPROVED_COUNT" == "0" ]]; then
            eligible=true
          fi

          cat > "$body" <<BODY
          ## Maintenance leaf

          - Leaf: \`${leaf}\`
          - Policy: \`${policy}\`
          - Global dry-run: \`${GLOBAL_STATUS}\`
          - China gate: \`${CHINA_STATUS}\`
          - China gate hard failure: \`${CHINA_HARD_FAILURE}\`
          - Head blocked derivations: \`${CHINA_HEAD_BLOCKED_COUNT}\`
          - New blocked derivations: \`${CHINA_NEW_BLOCKED_COUNT}\`
          - Declared direct fetches: \`${CHINA_DIRECT_FETCH_COUNT}\`
          - Head unapproved derivations: \`${CHINA_HEAD_UNAPPROVED_COUNT}\`
          - New unapproved derivations: \`${CHINA_NEW_UNAPPROVED_COUNT}\`
          - Manual review required: \`${MANUAL_REVIEW}\`
          - Auto-merge eligible: \`${eligible}\`

          This PR is generated from a fixed leaf branch. New attempts update this same PR instead of opening another one.

          Eligible PRs are handed to GitHub auto-merge only after the global dry-run passes, this leaf introduces no unapproved China-gate misses, and the update does not modify maintenance policy, gate scripts, maintenance workflows, or Renovate config. Full-head misses are shown as baseline debt from a cold runner, but they do not block unrelated leaf PRs by themselves.
          BODY

          append_records() {
            local title="$1"
            local file="$2"

            [[ -s "$file" ]] || return 0
            {
              echo ""
              echo "### ${title}"
              echo '```text'
              sed -n '1,20p' "$file"
              if [[ "$(wc -l < "$file")" -gt 20 ]]; then
                echo "... truncated ..."
              fi
              echo '```'
            } >> "$body"
          }

          append_records "Head blocked derivations" "$RUNNER_TEMP/china-head.blocked"
          append_records "New blocked derivations" "$RUNNER_TEMP/china-new.blocked"
          append_records "Declared direct fetches" "$RUNNER_TEMP/china-direct.allowed"
          append_records "Head unapproved derivations" "$RUNNER_TEMP/china-unapproved.blocked"
          append_records "New unapproved derivations" "$RUNNER_TEMP/china-new-unapproved.blocked"
          append_records "China gate failure log" "$RUNNER_TEMP/china-gate.failure.log"
          append_records "Maintenance-sensitive files" "$RUNNER_TEMP/maintenance-sensitive.files"

          gh label create maintenance --color "0E8A16" --description "Automated maintenance PR" --force
          gh label create "policy-${policy}" --color "5319E7" --description "Maintenance policy ${policy}" --force
          gh label create "global-pass" --color "0E8A16" --description "Global dry-run passed" --force
          gh label create "global-fail" --color "D93F0B" --description "Global dry-run failed" --force
          gh label create "china-gate-pass" --color "0E8A16" --description "China-network maintenance gate passed" --force
          gh label create "china-gate-miss" --color "D93F0B" --description "China-network maintenance gate missed" --force
          gh label create "direct-fetch" --color "FBCA04" --description "Update includes declared direct release fetches" --force
          gh label create "manual-review" --color "D93F0B" --description "Maintenance update requires manual review" --force

          git switch -c "$branch"
          git add -A
          git commit -m "$title"
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "$branch"

          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          create_args=(--head "$branch" --base main --title "$title" --body-file "$body")
          if [[ "$eligible" != "true" ]]; then
            create_args+=(--draft)
          fi

          if [[ -z "$pr" ]]; then
            gh pr create "${create_args[@]}"
            pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$pr" --title "$title" --body-file "$body"
          fi

          gh pr edit "$pr" \
            --remove-label "global-pass,global-fail,china-cache-pass,china-cache-miss,china-gate-pass,china-gate-miss,direct-fetch,manual-review" || true

          labels="maintenance,policy-${policy},global-${GLOBAL_STATUS},china-gate-${CHINA_STATUS}"
          if [[ "$CHINA_DIRECT_FETCH" == "true" ]]; then
            labels="${labels},direct-fetch"
          fi
          if [[ "$MANUAL_REVIEW" == "true" ]]; then
            labels="${labels},manual-review"
          fi
          gh pr edit "$pr" --add-label "$labels"

          if [[ "$eligible" == "true" ]]; then
            gh pr ready "$pr" || true
            gh pr merge "$pr" --auto --squash
          else
            gh pr ready "$pr" --undo || true
          fi
