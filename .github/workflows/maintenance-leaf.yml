name: Maintenance Leaf Updates

on:
  workflow_dispatch:
    inputs:
      leaf:
        description: Leaf to update, or all eligible leaves
        required: true
        default: all
        type: choice
        options:
          - all
          - anyrun
          - nixpkgs-tools
          - wechat
          - codex
          - orca
          - zeroclaw
          - hyprland
          - sops-nix
          - impermanence
          - disko
          - base
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leaf: anyrun
            policy: tools
            inputs: anyrun
            hook: ""
          - leaf: nixpkgs-tools
            policy: tools
            inputs: nixpkgs-tools
            hook: ""
          - leaf: wechat
            policy: tools
            inputs: nixpkgs-wechat
            hook: ""
          - leaf: codex
            policy: tools
            inputs: ""
            hook: codex-release
          - leaf: orca
            policy: tools
            inputs: ""
            hook: orca-release
          - leaf: zeroclaw
            policy: tools
            inputs: ""
            hook: zeroclaw-release
          - leaf: hyprland
            policy: desktop
            inputs: hyprland
            hook: ""
          - leaf: sops-nix
            policy: infra
            inputs: sops-nix
            hook: ""
          - leaf: impermanence
            policy: infra
            inputs: impermanence
            hook: ""
          - leaf: disko
            policy: infra
            inputs: disko
            hook: ""
          - leaf: base
            policy: core
            inputs: nixpkgs home-manager
            hook: ""
    concurrency:
      group: maintenance-leaf-${{ matrix.leaf }}
      cancel-in-progress: false
    env:
      REQUESTED_LEAF: ${{ github.event.inputs.leaf || 'all' }}
      HOSTS: homePC linglong
      CHINA_SUBSTITUTER: https://mirrors.ustc.edu.cn/nix-channels/store
      NIXPKGS_ALLOW_UNFREE: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Plan leaf run
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          run_leaf=true
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_LEAF" != "all" && "$REQUESTED_LEAF" != "${{ matrix.leaf }}" ]]; then
              run_leaf=false
            fi
          else
            case "${{ matrix.policy }}" in
              tools)
                ;;
              desktop)
                [[ "$(date -u +%u)" == "6" ]] || run_leaf=false
                ;;
              infra|core)
                [[ "$(date -u +%d)" == "01" ]] || run_leaf=false
                ;;
              *)
                echo "Unknown policy: ${{ matrix.policy }}" >&2
                exit 1
                ;;
            esac
          fi

          echo "run=${run_leaf}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.plan.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        if: steps.plan.outputs.run == 'true'

      - name: Configure git
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Base China gate
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          read -r -a hosts <<< "$HOSTS"
          bash scripts/maint/china-gate.sh \
            --report-only \
            --output "$RUNNER_TEMP/china-base.blocked" \
            --direct-output "$RUNNER_TEMP/china-base.direct" \
            "${hosts[@]}"

      - name: Update leaf
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          bash scripts/maint/update-leaf.sh \
            "${{ matrix.leaf }}" \
            "${{ matrix.inputs }}" \
            "${{ matrix.hook }}"

      - name: Check for changes
        if: steps.plan.outputs.run == 'true'
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Global dry-run
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        id: global_gate
        shell: bash
        run: |
          set -euo pipefail

          status=pass
          read -r -a hosts <<< "$HOSTS"
          for host in "${hosts[@]}"; do
            if ! nix build --dry-run -L ".#nixosConfigurations.${host}.config.system.build.toplevel"; then
              status=fail
            fi
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: China gate
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        id: china_gate
        shell: bash
        run: |
          set -euo pipefail

          status=pass
          read -r -a hosts <<< "$HOSTS"
          : > "$RUNNER_TEMP/china-head.blocked"
          : > "$RUNNER_TEMP/china-head.direct"
          if ! bash scripts/maint/china-gate.sh \
            --report-only \
            --output "$RUNNER_TEMP/china-head.blocked" \
            --direct-output "$RUNNER_TEMP/china-head.direct" \
            "${hosts[@]}"; then
            status=miss
            : > "$RUNNER_TEMP/china-new.blocked"
            : > "$RUNNER_TEMP/china-new.direct"
            : > "$RUNNER_TEMP/china-direct.allowed"
            : > "$RUNNER_TEMP/china-unapproved.blocked"
          else
            comm -13 \
              "$RUNNER_TEMP/china-base.blocked" \
              "$RUNNER_TEMP/china-head.blocked" \
              > "$RUNNER_TEMP/china-new.blocked"
            comm -13 \
              "$RUNNER_TEMP/china-base.direct" \
              "$RUNNER_TEMP/china-head.direct" \
              > "$RUNNER_TEMP/china-new.direct"

            : > "$RUNNER_TEMP/china-direct.allowed"
            cp "$RUNNER_TEMP/china-new.blocked" "$RUNNER_TEMP/china-unapproved.blocked"
            leaf="${{ matrix.leaf }}"
            mapfile -t direct_markers < <(
              nix eval --raw --impure --expr \
                "let policy = builtins.fromJSON (builtins.readFile ./scripts/maint/policy.json); in builtins.concatStringsSep \"\\n\" (policy.leafDirectFetchMarkers.\"${leaf}\" or [])"
            )

            while IFS=$'\t' read -r host drv; do
              [[ -n "${host}${drv}" ]] || continue

              allowed_direct=false
              for marker in "${direct_markers[@]}"; do
                if [[ -n "$marker" && "$drv" == *"$marker"* ]]; then
                  allowed_direct=true
                  break
                fi
              done

              if [[ "$allowed_direct" == "true" ]]; then
                printf '%s\t%s\n' "$host" "$drv" >> "$RUNNER_TEMP/china-direct.allowed"
              else
                printf '%s\t%s\n' "$host" "$drv" >> "$RUNNER_TEMP/china-unapproved.blocked"
              fi
            done < "$RUNNER_TEMP/china-new.direct"

            if [[ -s "$RUNNER_TEMP/china-unapproved.blocked" ]]; then
              status=miss
            fi
          fi

          direct_fetch=false
          if [[ -s "$RUNNER_TEMP/china-direct.allowed" ]]; then
            direct_fetch=true
          fi

          head_blocked_count="$(wc -l < "$RUNNER_TEMP/china-head.blocked")"
          new_blocked_count="$(wc -l < "$RUNNER_TEMP/china-new.blocked")"
          direct_fetch_count="$(wc -l < "$RUNNER_TEMP/china-direct.allowed")"
          unapproved_count="$(wc -l < "$RUNNER_TEMP/china-unapproved.blocked")"
          {
            echo "status=${status}"
            echo "direct_fetch=${direct_fetch}"
            echo "head_blocked_count=${head_blocked_count//[[:space:]]/}"
            echo "new_blocked_count=${new_blocked_count//[[:space:]]/}"
            echo "direct_fetch_count=${direct_fetch_count//[[:space:]]/}"
            echo "unapproved_count=${unapproved_count//[[:space:]]/}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish leaf PR
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GLOBAL_STATUS: ${{ steps.global_gate.outputs.status }}
          CHINA_STATUS: ${{ steps.china_gate.outputs.status }}
          CHINA_DIRECT_FETCH: ${{ steps.china_gate.outputs.direct_fetch }}
          CHINA_HEAD_BLOCKED_COUNT: ${{ steps.china_gate.outputs.head_blocked_count }}
          CHINA_NEW_BLOCKED_COUNT: ${{ steps.china_gate.outputs.new_blocked_count }}
          CHINA_DIRECT_FETCH_COUNT: ${{ steps.china_gate.outputs.direct_fetch_count }}
          CHINA_UNAPPROVED_COUNT: ${{ steps.china_gate.outputs.unapproved_count }}
        shell: bash
        run: |
          set -euo pipefail

          leaf="${{ matrix.leaf }}"
          policy="${{ matrix.policy }}"
          branch="maint/${leaf}"
          title="chore(maint): update ${leaf}"
          body="$(mktemp)"
          manual_merge=false
          if [[ "$leaf" == "nixpkgs-tools" ]]; then
            manual_merge=true
          fi

          eligible=false
          if [[ "$manual_merge" != "true" && "$GLOBAL_STATUS" == "pass" && "$CHINA_STATUS" == "pass" ]]; then
            eligible=true
          fi

          cat > "$body" <<BODY
          ## Maintenance leaf

          - Leaf: \`${leaf}\`
          - Policy: \`${policy}\`
          - Global dry-run: \`${GLOBAL_STATUS}\`
          - China gate: \`${CHINA_STATUS}\`
          - Head blocked derivations: \`${CHINA_HEAD_BLOCKED_COUNT}\`
          - New blocked derivations: \`${CHINA_NEW_BLOCKED_COUNT}\`
          - Declared direct fetches: \`${CHINA_DIRECT_FETCH_COUNT}\`
          - Unapproved derivations: \`${CHINA_UNAPPROVED_COUNT}\`
          - Auto-merge eligible: \`${eligible}\`

          This PR is generated from a fixed leaf branch. New attempts update this same PR instead of opening another one.

          Auto-merge is only attempted when the global dry-run passes and this leaf introduces no unapproved China-gate misses. The full head closure is shown for diagnosis because a cold GitHub runner can expose existing cache misses that should not block every leaf PR.
          BODY

          append_records() {
            local title="$1"
            local file="$2"

            [[ -s "$file" ]] || return 0
            {
              echo ""
              echo "### ${title}"
              echo '```text'
              sed -n '1,20p' "$file"
              if [[ "$(wc -l < "$file")" -gt 20 ]]; then
                echo "... truncated ..."
              fi
              echo '```'
            } >> "$body"
          }

          append_records "Head blocked derivations" "$RUNNER_TEMP/china-head.blocked"
          append_records "New blocked derivations" "$RUNNER_TEMP/china-new.blocked"
          append_records "Declared direct fetches" "$RUNNER_TEMP/china-direct.allowed"
          append_records "Unapproved derivations" "$RUNNER_TEMP/china-unapproved.blocked"

          gh label create maintenance --color "0E8A16" --description "Automated maintenance PR" --force
          gh label create "policy-${policy}" --color "5319E7" --description "Maintenance policy ${policy}" --force
          gh label create "global-pass" --color "0E8A16" --description "Global dry-run passed" --force
          gh label create "global-fail" --color "D93F0B" --description "Global dry-run failed" --force
          gh label create "china-gate-pass" --color "0E8A16" --description "China-network maintenance gate passed" --force
          gh label create "china-gate-miss" --color "D93F0B" --description "China-network maintenance gate missed" --force
          gh label create "direct-fetch" --color "FBCA04" --description "Update includes declared direct release fetches" --force

          git switch -c "$branch"
          git add -A
          git commit -m "$title"
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "$branch"

          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          create_args=(--head "$branch" --base main --title "$title" --body-file "$body")
          if [[ "$eligible" != "true" ]]; then
            create_args+=(--draft)
          fi

          if [[ -z "$pr" ]]; then
            gh pr create "${create_args[@]}"
            pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$pr" --title "$title" --body-file "$body"
          fi

          gh pr edit "$pr" \
            --remove-label "global-pass,global-fail,china-cache-pass,china-cache-miss,china-gate-pass,china-gate-miss,direct-fetch" || true

          labels="maintenance,policy-${policy},global-${GLOBAL_STATUS},china-gate-${CHINA_STATUS}"
          if [[ "$CHINA_DIRECT_FETCH" == "true" ]]; then
            labels="${labels},direct-fetch"
          fi
          gh pr edit "$pr" --add-label "$labels"

          if [[ "$eligible" == "true" ]]; then
            gh pr ready "$pr" || true
            gh pr merge "$pr" --auto --squash || true
          else
            gh pr ready "$pr" --undo || true
          fi
