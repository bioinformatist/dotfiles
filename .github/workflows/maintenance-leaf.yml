name: Maintenance Leaf Updates

on:
  workflow_dispatch:
    inputs:
      leaf:
        description: Leaf to update, or all eligible leaves
        required: true
        default: all
        type: choice
        options:
          - all
          - zeroclaw
  schedule:
    - cron: "23 20 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leaf: zeroclaw
            policy: tools
    concurrency:
      group: maintenance-leaf-${{ matrix.leaf }}
      cancel-in-progress: false
    env:
      REQUESTED_LEAF: ${{ github.event.inputs.leaf || 'all' }}
      GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}

    steps:
      - name: Plan leaf run
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          run_leaf=true
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_LEAF" != "all" && "$REQUESTED_LEAF" != "${{ matrix.leaf }}" ]]; then
              run_leaf=false
            fi
          else
            case "${{ github.event.schedule }}" in
              "23 20 * * *")
                [[ "${{ matrix.leaf }}" == "zeroclaw" ]] || run_leaf=false
                ;;
              *)
                echo "Unknown maintenance schedule: ${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
          fi

          echo "run=${run_leaf}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.plan.outputs.run == 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      - uses: cachix/install-nix-action@v31
        if: steps.plan.outputs.run == 'true'

      - name: Configure git
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update leaf
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          bash scripts/maint/update-leaf.sh "${{ matrix.leaf }}"

      - name: Check for changes
        if: steps.plan.outputs.run == 'true'
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check maintenance-sensitive changes
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        id: sensitive
        shell: bash
        run: |
          set -euo pipefail

          {
            git diff --no-renames --name-only origin/main
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/changed.files"
          grep -E '^(\.github/workflows/maintenance-[^/]*\.yml|scripts/maint/(policy[^/]*\.json|[^/]*\.(sh|jq))|renovate\.json)$' \
            "$RUNNER_TEMP/changed.files" > "$RUNNER_TEMP/maintenance-sensitive.files" || [[ $? -eq 1 ]]

          manual_review=false
          if [[ -s "$RUNNER_TEMP/maintenance-sensitive.files" ]]; then
            manual_review=true
          fi

          echo "manual_review=${manual_review}" >> "$GITHUB_OUTPUT"

      - name: Close unchanged leaf PR
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail

          branch="maint/${{ matrix.leaf }}"
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then
            gh pr close "$pr" \
              --comment "No changes remain for this fixed leaf; closing the stale maintenance PR."
            git push origin --delete "$branch" || true
          fi

      - name: Publish leaf PR
        if: steps.plan.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        env:
          MANUAL_REVIEW: ${{ steps.sensitive.outputs.manual_review }}
        shell: bash
        run: |
          set -euo pipefail

          leaf="${{ matrix.leaf }}"
          policy="${{ matrix.policy }}"
          branch="maint/${leaf}"
          title="chore(maint): update ${leaf}"
          body="$(mktemp)"

          cat > "$body" <<BODY
          ## Maintenance leaf

          - Leaf: \`${leaf}\`
          - Policy: \`${policy}\`
          - Manual review required: \`${MANUAL_REVIEW}\`

          This PR is generated from a fixed leaf branch. New attempts update this same PR instead of opening another one.

          See Checks for the required maintenance gate's configuration and cache preflight results. Changes to maintenance policy, maintenance scripts, maintenance workflows, or Renovate config require manual review.
          BODY

          if [[ "$MANUAL_REVIEW" == "true" ]]; then
            {
              echo ""
              echo "### Maintenance-sensitive files"
              sed -e 's/^/- `/' -e 's/$/`/' "$RUNNER_TEMP/maintenance-sensitive.files"
            } >> "$body"
          fi

          pr_json="$(gh pr list --head "$branch" --state open --json number,isDraft,autoMergeRequest,labels --jq '.[0] // {}')"
          pr="$(jq -r '.number // empty' <<< "$pr_json")"
          if [[ "$MANUAL_REVIEW" == "true" && -n "$pr" ]]; then
            if jq -e '.autoMergeRequest != null' <<< "$pr_json" > /dev/null; then
              gh pr merge "$pr" --disable-auto
            fi
            if jq -e '.isDraft == false' <<< "$pr_json" > /dev/null; then
              gh pr ready "$pr" --undo
            fi
          fi

          gh label create maintenance --color "0E8A16" --description "Automated maintenance PR" --force
          gh label create "policy-${policy}" --color "5319E7" --description "Maintenance policy ${policy}" --force
          gh label create "manual-review" --color "D93F0B" --description "Maintenance update requires manual review" --force

          git switch -c "$branch"
          git add -A
          git commit -m "$title"
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "$branch"
          head_commit="$(git rev-parse HEAD)"

          create_args=(--head "$branch" --base main --title "$title" --body-file "$body")
          if [[ "$MANUAL_REVIEW" == "true" ]]; then
            create_args+=(--draft)
          fi

          if [[ -z "$pr" ]]; then
            gh pr create "${create_args[@]}"
            pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$pr" --title "$title" --body-file "$body"
          fi

          labels="maintenance,policy-${policy}"
          if [[ "$MANUAL_REVIEW" == "true" ]]; then
            labels="${labels},manual-review"
          elif jq -e '.labels[]? | select(.name == "manual-review")' <<< "$pr_json" > /dev/null; then
            gh pr edit "$pr" --remove-label manual-review
          fi
          gh pr edit "$pr" --add-label "$labels"

          if [[ "$MANUAL_REVIEW" != "true" ]]; then
            if [[ -n "$pr" ]] && jq -e '.isDraft == true' <<< "$pr_json" > /dev/null; then
              gh pr ready "$pr"
            fi
            gh pr merge "$pr" --auto --squash --match-head-commit "$head_commit"
          fi
