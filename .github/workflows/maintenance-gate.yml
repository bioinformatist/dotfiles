name: Maintenance Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: maintenance-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    env:
      NIXPKGS_ALLOW_UNFREE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
      # Nix 2.34.7's read-only flake check cannot read Hyprland's filtered VERSION in a cold store.
      - run: nix eval --raw --impure --no-write-lock-file --option allow-import-from-derivation false '.#nixosConfigurations.homePC.config.programs.hyprland.package.src'
      - run: nix flake check --no-build --impure --no-write-lock-file --option allow-import-from-derivation false
      - run: nix eval --raw --impure '.#homeConfigurations."ci@headless".activationPackage.drvPath'
      - run: nix build --impure --no-link -L .#checks.x86_64-linux.wechat-control .#checks.x86_64-linux.codex-base-adapter .#checks.x86_64-linux.repo-local-skills
      - run: bash scripts/maint/test-cache-preflight.sh

  cache-preflight:
    runs-on: ubuntu-latest
    env:
      NIXPKGS_ALLOW_UNFREE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
      - name: Compare upstream and USTC
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap '
            status=$?
            git worktree remove --force "$tmp/base" 2>/dev/null || true
            if ! find -P "$tmp" -type d -exec chmod u+w {} + || ! rm -rf "$tmp"; then
              if (( status == 0 )); then status=1; fi
            fi
            exit "$status"
          ' EXIT
          case "$GITHUB_EVENT_NAME" in
            pull_request) base_sha="$(git rev-parse HEAD^1)" ;;
            merge_group) base_sha="$(jq -er '.merge_group.base_sha' "$GITHUB_EVENT_PATH")" ;;
            workflow_dispatch) base_sha="$(git rev-parse origin/main)" ;;
            *) echo "unsupported event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          head_sha="$(git rev-parse HEAD)"
          printf 'base=%s head=%s nix=%s\n' "$base_sha" "$head_sha" "$(nix --version)"
          printf "Cache preflight: base \`%s\`, head \`%s\`, Nix \`%s\`\n\n" \
            "$base_sha" "$head_sha" "$(nix --version)" >> "$GITHUB_STEP_SUMMARY"
          git worktree add --detach "$tmp/base" "$base_sha"
          mkdir "$tmp/probe"
          args=(--base-root "$tmp/base" --head-root . --work-dir "$tmp/probe" --summary "$GITHUB_STEP_SUMMARY")
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "${GITHUB_HEAD_REF:-}" == maint/* ]]; then
            args+=(--leaf "${GITHUB_HEAD_REF#maint/}")
          fi
          status=0
          bash scripts/maint/cache-preflight.sh "${args[@]}" || status=$?
          for file in "$tmp/probe"/*.nix.log "$tmp/probe"/*.outputs.json \
            "$tmp/probe"/*-policy.{json,err} "$tmp/probe"/{official,ustc}.{json,err} \
            "$tmp/probe"/curl.err "$tmp/probe"/*.plan.json \
            "$tmp/probe"/*.tsv "$tmp/probe"/*.txt; do
            if [[ -f "$file" ]]; then
              echo "=== ${file##*/} ==="
              cat "$file"
            fi
          done
          exit "$status"

  gate:
    name: maintenance gate
    needs: [configuration, cache-preflight]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize required result
        env:
          CONFIGURATION: ${{ needs.configuration.result }}
          CACHE_PREFLIGHT: ${{ needs.cache-preflight.result }}
        run: |
          printf 'configuration=%s cache-preflight=%s\n' "$CONFIGURATION" "$CACHE_PREFLIGHT"
          [[ "$CONFIGURATION" == success && "$CACHE_PREFLIGHT" == success ]]
