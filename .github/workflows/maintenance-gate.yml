name: Maintenance Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: maintenance gate
    runs-on: ubuntu-latest
    env:
      HOSTS: homePC linglong
      CHINA_SUBSTITUTERS: >-
        https://mirrors.ustc.edu.cn/nix-channels/store
        https://anyrun.cachix.org
        https://hyprland.cachix.org
      DECLARED_EXTRA_SUBSTITUTERS: >-
        https://anyrun.cachix.org
        https://hyprland.cachix.org
      CHINA_EXTRA_TRUSTED_PUBLIC_KEYS: >-
        anyrun.cachix.org-1:pqBobmOjI7nKlsUMV25u9QHa9btJK65/C8vnO3p346s=
        hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      NIXPKGS_ALLOW_UNFREE: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Global dry-run
        shell: bash
        run: |
          set -euo pipefail

          read -r -a hosts <<< "$HOSTS"
          for host in "${hosts[@]}"; do
            nix build \
              --dry-run \
              -L \
              --option extra-substituters "$DECLARED_EXTRA_SUBSTITUTERS" \
              --option extra-trusted-public-keys "$CHINA_EXTRA_TRUSTED_PUBLIC_KEYS" \
              ".#nixosConfigurations.${host}.config.system.build.toplevel"
          done

      - name: Headless module China gate
        shell: bash
        run: |
          set -euo pipefail

          output="$(mktemp)"
          if ! nix build \
            --dry-run \
            -L \
            --option substituters "$CHINA_SUBSTITUTERS" \
            --option extra-substituters "" \
            --option extra-trusted-public-keys "$CHINA_EXTRA_TRUSTED_PUBLIC_KEYS" \
            '.#homeConfigurations."ci@headless".activationPackage' \
            >"$output" \
            2>&1; then
            cat "$output" >&2
            exit 1
          fi

          mapfile -t derivations < <(
            awk '/^[[:space:]]*\/nix\/store\/.*\.drv$/ { sub(/^[[:space:]]+/, ""); print }' "$output" | sort -u
          )
          rm -f "$output"

          mapfile -t allowed_markers < <(jq -r '.allowedLocalBuildMarkers[]' scripts/maint/policy.json)
          mapfile -t direct_markers < <(jq -r '.allowedDirectFetchMarkers[]' scripts/maint/policy.json)

          contains_marker() {
            local text="$1"
            shift
            local marker
            for marker in "$@"; do
              if [[ "$text" == *"$marker"* ]]; then
                return 0
              fi
            done
            return 1
          }

          blocked=()
          direct=()
          for drv in "${derivations[@]}"; do
            if contains_marker "$drv" "${allowed_markers[@]}"; then
              continue
            elif contains_marker "$drv" "${direct_markers[@]}"; then
              direct+=("$drv")
            else
              blocked+=("$drv")
            fi
          done

          if [[ "${#direct[@]}" -gt 0 ]]; then
            {
              echo "### Headless module declared direct fetches"
              echo
              printf '  %s\n' "${direct[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${#blocked[@]}" -gt 0 ]]; then
            echo "Headless module gate found unapproved local derivations:" >&2
            printf '  %s\n' "${blocked[@]:0:20}" >&2
            exit 1
          fi

      - name: China gate
        shell: bash
        run: |
          set -euo pipefail

          read -r -a hosts <<< "$HOSTS"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          git fetch origin main:refs/remotes/origin/main
          git worktree add --detach "$tmp/base" origin/main

          bash "$tmp/base/scripts/maint/china-gate.sh" \
            --report-only \
            --output "$tmp/china-base.blocked" \
            --direct-output "$tmp/china-base.direct" \
            "${hosts[@]}"

          bash scripts/maint/china-gate.sh \
            --report-only \
            --output "$tmp/china-head.blocked" \
            --direct-output "$tmp/china-head.direct" \
            "${hosts[@]}"

          eval_args=(
            --base-blocked "$tmp/china-base.blocked"
            --base-direct "$tmp/china-base.direct"
            --head-blocked "$tmp/china-head.blocked"
            --head-direct "$tmp/china-head.direct"
            --output-dir "$tmp"
            --summary "$GITHUB_STEP_SUMMARY"
            --fail-on-miss
          )
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "${GITHUB_HEAD_REF:-}" == maint/* ]]; then
            eval_args+=(--leaf "${GITHUB_HEAD_REF#maint/}")
          fi

          if ! bash scripts/maint/evaluate-china-gate.sh "${eval_args[@]}"; then
            echo "China gate found new unapproved derivations:" >&2
            sed -n '1,20p' "$tmp/china-new-unapproved.blocked" >&2
            exit 1
          fi
